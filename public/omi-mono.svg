<?xml version="1.0" encoding="UTF-8"?>
<!--
  OMI UNIVERSAL AI — monochrome mark.

  One colour, no gradients, no glow. For favicons, single-colour print, and any
  surface where the accent range would be lost (laser printing, embossing,
  monochrome displays). `currentColor` is not available in a standalone file, so
  the mark is drawn in #F6F7FB and recoloured at the call site when needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Omi Universal AI">
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="176" ry="132" fill="none"
             stroke="#F6F7FB" stroke-width="14" stroke-opacity="0.55" stroke-linecap="round"/>
    <circle cx="424" cy="256" r="19" fill="#F6F7FB"/>
    <circle cx="140" cy="192" r="13" fill="#F6F7FB"/>
    <circle cx="196" cy="374" r="11" fill="#F6F7FB"/>
  </g>
  <circle cx="256" cy="256" r="74" fill="#F6F7FB"/>
</svg>
