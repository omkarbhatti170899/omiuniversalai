name: Deploy to GitHub Pages

# Omi Universal AI — frontend deployment (GitHub Pages target).
# Builds the EXISTING production bundle (convex codegen → tsc → vite build,
# all via the repo's own `bun run build`) and publishes dist/ to Pages.
# The backend stays on the existing Convex deployment; the frontend talks to
# it via the PUBLIC VITE_CONVEX_URL connection string.
#
# Convex bindings: src/convex/_generated is COMMITTED (Convex's documented
# best practice — https://docs.convex.dev/producing-code). CI therefore needs
# NO Convex credentials: if `convex codegen` has no deployment configured it
# falls back to the committed bindings (see package.json build script).
# No secrets live in the repo — GitHub injects its ephemeral Pages deploy
# token automatically, and AI keys remain server-side in the Convex
# dashboard (§28).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun (uses the repo's bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          # Public backend connection string (NOT a secret). Resolution order:
          # repo VARIABLE → repo SECRET → this repo's existing deployment URL.
          # (A convex.cloud URL identifies the backend like a Firebase project
          # id — safe to expose; it grants no access.)
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL || secrets.CONVEX_URL || 'https://resolute-ptarmigan-187.convex.cloud' }}
          # Serve the SPA under the repository subpath.
          VITE_BASE_PATH: /omiuniversalai/
        run: bun run build

      - name: Verify backend URL is compiled into the bundle
        env:
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL || secrets.CONVEX_URL || 'https://resolute-ptarmigan-187.convex.cloud' }}
        run: |
          # Tripwire: if VITE_CONVEX_URL ever resolves empty, the bundle ships
          # a runtime throw ("VITE_CONVEX_URL is not set") = blank page for
          # every visitor. Fail here, before the deploy step, instead.
          if [ -z "$VITE_CONVEX_URL" ] || ! grep -rqF "$VITE_CONVEX_URL" dist/assets/; then
            echo "::error::VITE_CONVEX_URL was not compiled into the bundle — the deployed site would be a blank page."
            exit 1
          fi
          echo "✓ Backend URL compiled into bundle"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
