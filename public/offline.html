<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Omi Universal AI</title>
    <style>
      :root { color-scheme: dark; }
      /* "Omi Dark Intelligence" — the offline shell matches the app theme. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0B0B0F;
        color: #eceaf2;
      }
      /* The Omi mark, inline: the offline shell is a static file and cannot
         import the app, so it carries the same geometry in miniature. */
      .mark { width: 56px; height: 56px; display: block; margin: 0 auto 1.25rem; }
      .card {
        max-width: 26rem;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #8B93AD;
      }
      h1 { font-size: 1.375rem; margin: 0.75rem 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; opacity: 0.75; margin: 0 0 1.5rem; }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        background: #5b57d6;
        color: #fff;
      }
      button:hover { background: #4f4bc4; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 512 512" role="img" aria-label="Omi Universal AI">
        <defs>
          <linearGradient id="c" x1="186" y1="186" x2="326" y2="326" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8B98FF" />
            <stop offset="0.55" stop-color="#6E7BFF" />
            <stop offset="1" stop-color="#22D3EE" />
          </linearGradient>
          <linearGradient id="r" x1="96" y1="120" x2="416" y2="392" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9" />
            <stop offset="0.5" stop-color="#6E7BFF" stop-opacity="0.75" />
            <stop offset="1" stop-color="#8B98FF" stop-opacity="0.55" />
          </linearGradient>
        </defs>
        <g transform="rotate(-22 256 256)">
          <ellipse cx="256" cy="256" rx="176" ry="132" fill="none" stroke="url(#r)" stroke-width="14" stroke-linecap="round" />
          <circle cx="424" cy="256" r="19" fill="url(#c)" />
          <circle cx="140" cy="192" r="13" fill="#22D3EE" />
        </g>
        <circle cx="256" cy="256" r="74" fill="url(#c)" />
      </svg>
      <span class="badge">Omi Universal AI</span>
      <h1>You're offline</h1>
      <p>
        Omi couldn't reach the network. Your data is safe — conversations,
        knowledge and files live server-side and will sync when you're back.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
