<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Omi Universal AI</title>
    <style>
      :root { color-scheme: dark; }
      /* "Omi Dark Intelligence" — the offline shell matches the app theme. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #121216;
        color: #eceaf2;
      }
      .card {
        max-width: 26rem;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a5a1f0;
      }
      h1 { font-size: 1.375rem; margin: 0.75rem 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; opacity: 0.75; margin: 0 0 1.5rem; }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        background: #5b57d6;
        color: #fff;
      }
      button:hover { background: #4f4bc4; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Ominnovations Intelligence</span>
      <h1>You're offline</h1>
      <p>
        Omi couldn't reach the network. Your data is safe — conversations,
        knowledge and files live server-side and will sync when you're back.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
