# Omi's controlled SearXNG — Fly.io deployment (ONE instance, permanent HTTPS).
#
# WHY FLY: a permanent https://<app>.fly.dev URL with automatic TLS, running
# OUR container with OUR settings.yml, for a few dollars a month
# (shared-cpu-1x / 512 MB is ample for a metasearch front). No Caddy needed —
# Fly terminates TLS at the edge; the JSON API stays gated by the shared
# secret (SEARXNG_SHARED_SECRET), which Omi presents as X-Omi-Secret.
#
# OWNER DEPLOYMENT (one time, ~5 minutes):
#   1. brew install flyctl && fly auth signup        (or `fly auth login`)
#   2. cd deploy/searxng
#   3. fly launch --no-deploy --name omi-searxng     (choose any region, e.g. iad)
#   4. fly secrets set SEARXNG_SHARED_SECRET="$(openssl rand -hex 24)"
#   5. fly deploy
#   6. PROVE the JSON endpoint:
#        curl -H "X-Omi-Secret: <secret>" "https://omi-searxng.fly.dev/search?q=test&format=json"
#      → must return a JSON body with a `results` array.
#   7. Point production at it (server-side only):
#        bunx convex env set SEARXNG_BASE_URL https://omi-searxng.fly.dev
#        bunx convex env set SEARXNG_SHARED_SECRET <same secret>
#   8. Verify from the production backend:
#        bunx convex run diagnosticsSearxngDeep:probeSearxngCandidates '{}'
#      → our instance must appear healthy/verified FIRST.
#
# What is deliberately NOT here: Caddy. Fly's edge is the reverse proxy
# (TLS + HTTP/2 + health checks). Everything else is the same hardened
# instance defined in settings.yml + limiter.toml.

app = "omi-searxng"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  SEARXNG_BASE_URL = "https://omi-searxng.fly.dev/"
  # Bind inside the container on the port Fly's proxy expects.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The health endpoint/probe: unauthenticated, cheap, no engine fan-out.
  # Path is "/" on Fly because TLS termination happens at the edge proxy and
  # the container serves the stock SearXNG app (whose index answers 200 with
  # zero search work). The compose+Caddy variant of this package serves a
  # dedicated /healthz responder; on Fly the platform check is the probe.
  [http_service.checks]
    [http_service.checks.health]
      path = "/"
      interval = "30s"
      timeout = "5s"
      grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
