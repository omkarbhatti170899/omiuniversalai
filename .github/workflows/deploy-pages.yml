name: Deploy to GitHub Pages

# Omi Universal AI — primary production frontend (GitHub Pages).
#
# This workflow is the SINGLE production deployment path for the frontend.
#
# Design rule (Phase 2): the approved production Convex backend exists in
# exactly ONE place in this repository — the `VITE_CONVEX_URL` literal below.
# The artifact gates re-assert it, and the live-verification job proves the
# deployed bytes still contain it.
#
# A stale repository variable or secret named CONVEX_URL can never override
# this: Vite only inlines VITE_-prefixed vars, the pin step asserts
# VITE_CONVEX_URL still equals the approved deployment, and a hard guard fails
# the job if a legacy CONVEX_URL variable/secret exists with a different value.
#
# Everything is automated. The workflow fails hard rather than shipping a build
# against the wrong backend.
#
# NOTE ON FORMATTING: every `run:` block below is a YAML literal block scalar.
# All of its lines — including heredoc bodies and their terminators — must be
# indented deeper than the `run:` key. A line at column 0 silently terminates
# the scalar and makes the whole workflow unparseable, so the workflow is
# validated by scripts/prodGates/validateWorkflow.ts (also run in CI).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two Pages deploys from racing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # ---------------------------------------------------------------------------
  # SINGLE SOURCE OF TRUTH for the production backend.
  #
  # Vite inlines `VITE_*` variables at build time, so this literal is what the
  # shipped bundle actually talks to. It is the ONLY backend declaration in the
  # workflow; every other reference derives from it.
  #
  # The "Pin production backend" step below asserts this still equals the
  # approved production deployment, and refuses to build if a legacy repository
  # variable or secret named CONVEX_URL exists with a different value. A wrong
  # or silently-overridden backend must fail the build, never deploy.
  # ---------------------------------------------------------------------------
  VITE_CONVEX_URL: https://majestic-turtle-372.convex.cloud
  VITE_BASE_PATH: /omiuniversalai/
  # Live checks below target the published Pages origin.
  OMI_PAGES_ORIGIN: https://omkarbhatti170899.github.io
  OMI_PAGES_BASE: /omiuniversalai/

jobs:
  # ===========================================================================
  # BUILD + GATE
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # -----------------------------------------------------------------------
      # Phase 16 — the workflow must be valid before it is trusted to deploy.
      # This is the check that would have caught the broken block-scalar
      # indentation that silently stopped production from tracking main.
      # -----------------------------------------------------------------------
      - name: Validate deployment workflow
        run: bun scripts/prodGates/validateWorkflow.ts

      # -----------------------------------------------------------------------
      # Phase 2 — deterministic backend selection.
      # -----------------------------------------------------------------------
      - name: Pin production backend (reject legacy CONVEX_URL override)
        env:
          LEGACY_CONVEX_URL_VAR: ${{ vars.CONVEX_URL }}
          LEGACY_CONVEX_URL_SECRET: ${{ secrets.CONVEX_URL }}
        run: |
          set -euo pipefail

          APPROVED="https://majestic-turtle-372.convex.cloud"

          if [ "${VITE_CONVEX_URL}" != "${APPROVED}" ]; then
            echo "::error::VITE_CONVEX_URL ('${VITE_CONVEX_URL}') is not the approved production backend '${APPROVED}'."
            echo "::error::Update the literal in .github/workflows/deploy-pages.yml deliberately, then re-run."
            exit 1
          fi

          # DETECTION ONLY. These two values are never used to select a backend:
          # the backend comes solely from the VITE_CONVEX_URL literal above (Vite
          # only inlines VITE_-prefixed variables, so a bare CONVEX_URL could not
          # reach the bundle anyway). A stale repository variable or secret of
          # that name is still a misconfiguration worth failing on loudly, so its
          # PRESENCE is reported — and its value is deliberately never echoed,
          # since build logs are retained and readable.
          #
          # NOTE: variables and secrets are TWO DIFFERENT stores with two
          # different tabs. The messages below name the tab deliberately: an
          # operator who deletes the entry from the wrong tab gets this exact
          # failure again on the next push, which is what happened once already.
          if [ -n "${LEGACY_CONVEX_URL_VAR:-}" ] && [ "${LEGACY_CONVEX_URL_VAR}" != "${APPROVED}" ]; then
            echo "::error::A repository VARIABLE named CONVEX_URL exists and does not match the approved production backend. It is never used as a fallback — the backend comes only from the VITE_CONVEX_URL literal — but it is a stale setting, so the build refuses to proceed. Fix: Settings -> Secrets and variables -> Actions -> VARIABLES tab (the Secrets tab is a different store) -> delete CONVEX_URL, or set its value to the approved backend. The value is deliberately not printed; build logs are retained and readable."
            exit 1
          fi
          if [ -n "${LEGACY_CONVEX_URL_SECRET:-}" ] && [ "${LEGACY_CONVEX_URL_SECRET}" != "${APPROVED}" ]; then
            echo "::error::A repository SECRET named CONVEX_URL exists and does not match the approved production backend. It is never used as a fallback; the backend comes only from the VITE_CONVEX_URL literal. Fix: Settings -> Secrets and variables -> Actions -> SECRETS tab (the Variables tab is a different store) -> delete CONVEX_URL. The value is deliberately not printed; build logs are retained and readable."
            exit 1
          fi

          echo "Pinned VITE_CONVEX_URL=${VITE_CONVEX_URL}"
          echo "Pinned VITE_BASE_PATH=${VITE_BASE_PATH}"

      # -----------------------------------------------------------------------
      # Phase 4 — build gates. Deployment cannot happen if any gate fails.
      # -----------------------------------------------------------------------
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test suite
        run: bun run test

      # -----------------------------------------------------------------------
      # Credential containment, BEFORE anything is built or published.
      #
      # `checkSecretShapes` (below) scans the SHIPPED artifact; this scans the
      # repository TEXT it is built from, so a key pasted into a component, doc
      # or config fails the run before it can reach a bundle. It skips dist/,
      # node_modules/ and its own redaction fixtures, and — critically — it
      # prints only the FILE and the PATTERN NAME it matched, never a value:
      # a scanner that echoes the secret would itself become the leak.
      # -----------------------------------------------------------------------
      - name: Scan repository for credential-shaped strings
        run: bun scripts/secretExposureCheck.ts

      - name: Build production bundle
        run: bun run build

      # -----------------------------------------------------------------------
      # Phase 3 — deployment identity. Not a secret; makes production
      # debugging deterministic.
      # -----------------------------------------------------------------------
      - name: Compute deployment identity
        id: identity
        run: |
          set -euo pipefail
          COMMIT="${GITHUB_SHA}"
          BACKEND="${VITE_CONVEX_URL}"
          BASE_PATH="${VITE_BASE_PATH}"

          mkdir -p dist
          cat > dist/deployment-info.json <<EOF
          {
            "commit": "${COMMIT}",
            "backend": "${BACKEND}",
            "basePath": "${BASE_PATH}",
            "builtBy": "github-pages-workflow",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF

          {
            echo "commit=${COMMIT}"
            echo "backend=${BACKEND}"
            echo "basePath=${BASE_PATH}"
          } >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------------
      # Phase 5 — production bundle verification. Fails the deployment on any
      # mismatch, wrong backend, or credential-shaped string.
      # -----------------------------------------------------------------------
      - name: Verify deployment artifact
        env:
          COMMIT: ${{ github.sha }}
          BACKEND: ${{ env.VITE_CONVEX_URL }}
          BASE_PATH: ${{ env.VITE_BASE_PATH }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          echo "== entry point =="
          [ -f index.html ] || fail "missing repository index.html"
          [ -f dist/index.html ] || fail "missing dist/index.html"
          echo "ok index.html + dist/index.html"

          echo "== SPA routing + PWA source assets =="
          for f in public/404.html public/manifest.webmanifest public/sw.js public/offline.html public/llms.txt; do
            [ -f "$f" ] || fail "missing $f"
          done
          echo "ok 404.html, manifest.webmanifest, sw.js, offline.html, llms.txt"

          echo "== those assets are present in the shipped artifact =="
          for f in dist/404.html dist/manifest.webmanifest dist/sw.js dist/offline.html dist/index.html; do
            [ -f "$f" ] || fail "missing $f in shipped artifact"
          done
          echo "ok SPA/PWA files shipped"

          echo "== hashed JS/CSS assets =="
          JS_COUNT=$(find dist/assets -maxdepth 1 -name '*.js' | wc -l | tr -d ' ')
          CSS_COUNT=$(find dist/assets -maxdepth 1 -name '*.css' | wc -l | tr -d ' ')
          [ "$JS_COUNT" -ge 1 ] || fail "no hashed .js assets in dist/assets"
          [ "$CSS_COUNT" -ge 1 ] || fail "no hashed .css assets in dist/assets"
          echo "ok $JS_COUNT hashed JS chunks, $CSS_COUNT hashed CSS files"

          echo "== base path is compiled in =="
          grep -qF "${BASE_PATH}" dist/index.html \
            || fail "dist/index.html does not reference ${BASE_PATH} — VITE_BASE_PATH was not applied"
          grep -rqF "basename:\"${BASE_PATH}\"" dist/assets/ \
            || fail "router basename ${BASE_PATH} not compiled into bundle"
          echo "ok base path ${BASE_PATH} present in index.html and router basename"

          echo "== deployment-info.json =="
          [ -f dist/deployment-info.json ] || fail "missing dist/deployment-info.json"
          bun scripts/prodGates/checkDeploymentInfo.ts dist/deployment-info.json "${COMMIT}" "${BACKEND}" "${BASE_PATH}"

          echo "== intended backend is compiled into the bundle =="
          grep -rqF "${BACKEND}" dist/assets/ \
            || fail "approved backend ${BACKEND} not found in built bundle"
          echo "ok ${BACKEND} present in dist/assets/"

          echo "== no other Convex deployment is referenced anywhere in the artifact =="
          bun scripts/prodGates/checkConvexDeployments.ts dist "${BACKEND}"

          echo "== credential-shaped strings in shipped artifacts =="
          bun scripts/prodGates/checkSecretShapes.ts dist

          echo "== commit reachability =="
          git cat-file -t "${COMMIT}" >/dev/null 2>&1 \
            || fail "deployment-info.json commit is not a known git object"
          echo "ok commit reachable"

      # -----------------------------------------------------------------------
      # Phase 13 (pre-deploy half) — the production backend must actually
      # answer before we point the frontend at it.
      # -----------------------------------------------------------------------
      - name: Verify production backend is live
        env:
          BACKEND: ${{ env.VITE_CONVEX_URL }}
        run: |
          set -euo pipefail
          SITE="${BACKEND%.convex.cloud}.convex.site"
          for path in /status /health /selftest; do
            code=$(curl -s -o "/tmp/omi$(basename "$path").json" -w '%{http_code}' -m 30 "${SITE}${path}" || echo 000)
            echo "${SITE}${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::production backend endpoint ${path} returned ${code}"; exit 1; }
          done
          bun scripts/prodGates/summarizeSelfTest.ts /tmp/omiselftest.json

      # -----------------------------------------------------------------------
      # Phase 17 — reachability is NOT configuration.
      #
      # The three probes above prove the backend ANSWERS. This audit proves the
      # deployment is actually configured to do what the product needs: publish
      # auth signing keys (without them every sign-in fails with HTTP 500) and
      # call a configured AI / vision / keyed-search provider. Production was
      # previously in that state — every endpoint 200, sign-in broken — and no
      # status-code check could see it.
      #
      # `--report` keeps the frontend deploy unblocked: the missing env vars are
      # an owner-side action, and refusing to publish would leave users on a
      # bundle compiled against a retired backend, which is strictly worse. The
      # failure signal lives in the strict post-deploy job instead.
      # -----------------------------------------------------------------------
      - name: Audit production backend configuration (report)
        env:
          BACKEND: ${{ env.VITE_CONVEX_URL }}
        run: |
          set -euo pipefail

          AUDIT="$(bun scripts/prodGates/checkBackendConfig.ts "${BACKEND}" --report 2>&1)"
          printf '%s\n' "${AUDIT}"

          {
            echo ""
            echo "### Production backend configuration"
            echo ""
            echo '```'
            printf '%s\n' "${AUDIT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ===========================================================================
  # DEPLOY
  # ===========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -----------------------------------------------------------------------
      # The deployment record lives in the DEPLOY job, so it may only use values
      # available there: its own `steps.deployment` outputs and `github` context.
      # It must NOT reach into the build job's `steps.identity` outputs — step
      # outputs are job-scoped and would silently expand to an empty string.
      # `backend` / `basePath` come from the workflow-level env (the single
      # source of truth), which is in scope for every job.
      # -----------------------------------------------------------------------
      - name: Persist deployment record
        if: always()
        run: |
          set -euo pipefail

          RECORD="$(cat <<EOF
          {
            "commit": "${{ github.sha }}",
            "backend": "${VITE_CONVEX_URL}",
            "basePath": "${VITE_BASE_PATH}",
            "pagesDeploymentStatus": "${{ steps.deployment.outputs.status }}",
            "pagesUrl": "${{ steps.deployment.outputs.page_url }}",
            "triggeredBy": "${{ github.actor }}",
            "trigger": "${{ github.event_name }}"
          }
          EOF
          )"

          echo "deployment record:"
          echo "${RECORD}"

          {
            echo "### Deployment record"
            echo ""
            echo '```json'
            echo "${RECORD}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # ===========================================================================
  # PHASE 7 + 16 — LIVE deployment verification.
  #
  # "Actions said success" is not proof. This job fetches the published bytes
  # and proves: live frontend commit == this commit, and the live bundle is
  # compiled against the approved backend.
  # ===========================================================================
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify live site matches this commit and backend
        env:
          COMMIT: ${{ github.sha }}
          BACKEND: ${{ env.VITE_CONVEX_URL }}
          ORIGIN: ${{ env.OMI_PAGES_ORIGIN }}
          BASE: ${{ env.OMI_PAGES_BASE }}
        run: |
          set -euo pipefail

          URL="${ORIGIN}${BASE}"
          LIVE_INFO="${URL}deployment-info.json"
          mkdir -p live

          echo "== waiting for deployment-info.json to propagate =="
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS -m 20 "${LIVE_INFO}" -o live/deployment-info.json 2>/dev/null; then
              if bun scripts/prodGates/checkDeploymentInfo.ts live/deployment-info.json "${COMMIT}" "${BACKEND}" "${BASE}" >/dev/null 2>&1; then
                ok=1
                echo "matched on attempt ${attempt}"
                break
              fi
              echo "attempt ${attempt}: deployment-info.json present but not yet this commit"
            else
              echo "attempt ${attempt}: deployment-info.json not published yet"
            fi
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Live ${LIVE_INFO} never reported commit ${COMMIT}. The published site is NOT this build."
            echo "::error::Last document received:"
            head -c 400 live/deployment-info.json 2>/dev/null || true
            exit 1
          fi

          echo "== live deployment identity =="
          bun scripts/prodGates/checkDeploymentInfo.ts live/deployment-info.json "${COMMIT}" "${BACKEND}" "${BASE}"

          echo "== live index.html =="
          curl -fsS -m 30 "${URL}" -o live/index.html
          grep -qF "${BASE}assets/" live/index.html \
            || { echo "::error::live index.html does not reference ${BASE}assets/"; exit 1; }
          echo "ok live index.html references ${BASE}assets/"

          echo "== live bundle backend identity =="
          bun scripts/prodGates/checkLiveBundle.ts "${URL}" "${BACKEND}"

          echo "== live backend reachability =="
          SITE="${BACKEND%.convex.cloud}.convex.site"
          for path in /status /selftest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "${SITE}${path}" || echo 000)
            echo "${SITE}${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::live backend ${path} returned ${code}"; exit 1; }
          done

          {
            echo "### Live verification"
            echo ""
            echo "Live frontend **${URL}** is commit ${COMMIT} and is compiled against ${BACKEND}."
          } >> "${GITHUB_STEP_SUMMARY}"

          # ---------------------------------------------------------------------
          # STRICT: the published site is reachable AND the backend it talks to
          # can actually serve users. A backend that answers but cannot
          # authenticate or synthesise is not a working release, so this one
          # fails the job — the published bytes above are still updated, and the
          # report lands in the step summary either way.
          # ---------------------------------------------------------------------
          echo "== live backend configuration (strict) =="
          set +e
          AUDIT="$(bun scripts/prodGates/checkBackendConfig.ts "${BACKEND}" --strict 2>&1)"
          audit_rc=$?
          set -e
          printf '%s\n' "${AUDIT}"

          {
            echo ""
            echo "### Production backend configuration (strict)"
            echo ""
            echo '```'
            printf '%s\n' "${AUDIT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${audit_rc}" -ne 0 ]; then
            echo "::error::production backend '${BACKEND}' is reachable but not fully configured (see the audit above; env vars are set per-deployment, never in this repository)."
            exit "${audit_rc}"
          fi
          echo "ok production backend configuration complete"
