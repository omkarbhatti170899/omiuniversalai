<?xml version="1.0" encoding="UTF-8"?>
<!--
  OMI UNIVERSAL AI — master brand mark (symbol only, transparent canvas).

  Concept, one sentence: ONE luminous core (one intelligence) held inside an
  open orbital ring of nodes (infinite possibilities). The ring is never
  closed and never symmetrical, so the mark reads as "always reaching" rather
  than "finished" — the same promise the product makes about live research.

  This file is the single source of truth for the mark. Every other variant is
  derived from the same geometry, never redrawn:
    • icon-maskable.svg   — same art, inset to Android's 80% safe zone
    • omi-mono.svg        — single-colour knock-down for print/favicons
    • omi-lockup.svg      — mark + OMI wordmark
    • public/icons/*.png  — rasterised from this geometry by
                            scripts/generateBrandIcons.ts
    • OmiMark.tsx         — the React component used across the app

  Accent range is deliberately restrained: indigo #6E7BFF through to cyan
  #22D3EE, on the product's near-black #0B0B0F. No neon, no glow stacking.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Omi Universal AI">
  <defs>
    <linearGradient id="omiCore" x1="186" y1="186" x2="326" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B98FF"/>
      <stop offset="0.55" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="omiRing" x1="96" y1="120" x2="416" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6E7BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B98FF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="omiGlow" cx="256" cy="256" r="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E7BFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6E7BFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient bloom behind the core: the only "light" in the mark. -->
  <circle cx="256" cy="256" r="196" fill="url(#omiGlow)"/>

  <!--
    The orbital ring. rx/ry differ (176/132) and it is rotated -22deg, which is
    what makes the mark feel in motion rather than like a target. Kept open by
    simply not drawing the closing nodes — see the node positions below.
  -->
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="176" ry="132" fill="none"
             stroke="url(#omiRing)" stroke-width="11" stroke-linecap="round"/>
    <!-- Three nodes on the ring: retrieval, verification, reasoning. -->
    <circle cx="424" cy="256" r="19" fill="url(#omiCore)"/>
    <circle cx="140" cy="192" r="13" fill="#22D3EE"/>
    <circle cx="196" cy="374" r="11" fill="#8B98FF"/>
  </g>

  <!-- The core: one intelligence. Solid, centred, unmissable at 16px. -->
  <circle cx="256" cy="256" r="74" fill="url(#omiCore)"/>
</svg>
