<!doctype html>
<html lang="en" class="dark" suppresshydrationwarning="true">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Theme bootstrap (§13): apply the saved dark/light/system choice before
    // first paint so switching themes can never flash the wrong one. Dark is
    // the default identity. Kept tiny and inline on purpose — a separate file
    // would race the first render.
    (function () {
      try {
        var stored = localStorage.getItem("omi-theme");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var dark = stored === "dark" || (stored !== "light" && !prefersLight);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        /* storage blocked — keep the dark default from the html class */
      }
    })();
  </script>
  <!--
    Brand icons. The SVG stays the primary (sharpest at any size, and the path
    the PWA test pins); the PNGs are what iOS/Android launchers and store
    listings actually read, generated by scripts/generateBrandIcons.ts.
  -->
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta
    name="description"
    content="Omi Universal AI — one intelligence, infinite possibilities. Conversation, live research with citations, knowledge, memory, files, vision and intelligent tools in one workspace. Created by Omkar Prakash Bhatti."
  />
  <!-- Dark-first by design ("Omi Dark Intelligence") — the app defaults to dark. -->
  <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fafafc" media="(prefers-color-scheme: light)" />

  <!--
    Social preview. Without these, every shared Omi link renders as a bare URL:
    no name, no motto, no mark. og:image points at the pre-rendered lockup so the
    card is correct without any client-side work.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Omi Universal AI" />
  <meta property="og:title" content="Omi Universal AI — One Intelligence. Infinite Possibilities." />
  <meta
    property="og:description"
    content="Conversation, live research, search, knowledge, memory, files, vision and intelligent tools — in one workspace. Created by Omkar Prakash Bhatti."
  />
  <meta property="og:image" content="./omi-lockup.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Omi Universal AI — One Intelligence. Infinite Possibilities." />
  <meta
    name="twitter:description"
    content="Conversation, live research, search, knowledge, memory, files, vision and intelligent tools — in one workspace."
  />
  <meta name="twitter:image" content="./omi-lockup.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Omi" />
  <title>Omi Universal AI — One Intelligence. Infinite Possibilities.</title>
</head>


<body>
  <div id="root"></div>

  <!--
    Branded splash. Inline and self-removing on two conditions (the app mounted,
    or 2.5s elapsed) so it can never become a spinner that outlives the app or
    a blank page if the bundle fails. Pure CSS, ~1 KB, no request of its own.
  -->
  <div id="omi-splash" aria-hidden="true">
    <style>
      #omi-splash {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: #0b0b0f;
        transition: opacity 260ms ease;
      }
      #omi-splash.gone { opacity: 0; pointer-events: none; }
      #omi-splash svg { width: 64px; height: 64px; animation: omi-splash-breathe 3.2s ease-in-out infinite; }
      #omi-splash span {
        font: 600 0.68rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #8b93ad;
      }
      @keyframes omi-splash-breathe { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #omi-splash svg { animation: none; } }
    </style>
    <svg viewBox="0 0 512 512">
      <defs>
        <linearGradient id="omi-splash-core" x1="186" y1="186" x2="326" y2="326" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8B98FF" />
          <stop offset="0.55" stop-color="#6E7BFF" />
          <stop offset="1" stop-color="#22D3EE" />
        </linearGradient>
        <linearGradient id="omi-splash-ring" x1="96" y1="120" x2="416" y2="392" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9" />
          <stop offset="0.5" stop-color="#6E7BFF" stop-opacity="0.75" />
          <stop offset="1" stop-color="#8B98FF" stop-opacity="0.55" />
        </linearGradient>
      </defs>
      <g transform="rotate(-22 256 256)">
        <ellipse cx="256" cy="256" rx="176" ry="132" fill="none" stroke="url(#omi-splash-ring)" stroke-width="13" stroke-linecap="round" />
        <circle cx="424" cy="256" r="19" fill="url(#omi-splash-core)" />
        <circle cx="140" cy="192" r="13" fill="#22D3EE" />
      </g>
      <circle cx="256" cy="256" r="74" fill="url(#omi-splash-core)" />
    </svg>
    <span>Omi Universal AI</span>
    <script>
      (function () {
        function dismiss() {
          var el = document.getElementById("omi-splash");
          if (!el) return;
          el.classList.add("gone");
          setTimeout(function () { el.remove(); }, 300);
        }
        // The app removes it the moment React mounts (see src/main.tsx); this is
        // the belt-and-braces path for a slow or failed bundle.
        setTimeout(dismiss, 2500);
      })();
    </script>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
